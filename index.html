<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파파킹 (PAPAKING) - 스마트 AI 번역기</title>
    <!-- FontAwesome 아이콘 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --sub-text: #666666;
            --border-color: #e1e4e8;
            --input-bg: #f8f9fa;
            --primary-color: #00c73c;
            --primary-hover: #00b135;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --sub-text: #aaaaaa;
            --border-color: #333333;
            --input-bg: #2a2a2a;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --------------------------------------------------
           [시작 임팩트] 파파킹 오프닝 스플래시 화면 애니메이션
        -------------------------------------------------- */
        #splash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutSplash 0.8s cubic-bezier(0.7, 0, 0.3, 1) 1.6s forwards;
        }

        .splash-title {
            color: #00c73c;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-shadow: 0 0 25px rgba(0, 199, 60, 0.6);
            /* 크게 나타났다가 점점 작아지며 사라지는 애니메이션 */
            animation: shrinkText 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-title i {
            color: #ffd700; /* 왕관 황금색 */
        }

        @keyframes shrinkText {
            0% {
                opacity: 0;
                transform: scale(2.2);
                filter: blur(8px);
            }
            30% {
                opacity: 1;
                transform: scale(1.2);
                filter: blur(0px);
            }
            80% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.6); /* 점점 작아짐 */
                filter: blur(4px);
            }
        }

        @keyframes fadeOutSplash {
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* --------------------------------------------------
           메인 PC 꽉 찬 카드 컨테이너 Layout
        -------------------------------------------------- */
        .app-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 1400px;
            min-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: mainAppear 0.8s ease 1.8s forwards;
        }

        @keyframes mainAppear {
            to { opacity: 1; }
        }

        /* 헤더 */
        .app-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 30px;
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .header-title i {
            color: #ffd700; /* 왕관 아이콘 */
        }

        .theme-toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        /* 언어 선택 바 */
        .lang-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            background-color: var(--input-bg);
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 18px;
            color: var(--text-color);
        }

        .lang-title {
            width: 120px;
            text-align: center;
        }

        .swap-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 16px;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .swap-btn:hover { transform: rotate(180deg); }

        /* 메인 분할 영역 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .input-area, .result-area {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            min-height: 350px;
        }

        .input-area:focus-within {
            border-color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 250px;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-size: 18px;
            color: var(--text-color);
            line-height: 1.6;
        }

        .result-text {
            height: 100%;
            min-height: 250px;
            font-size: 18px;
            color: var(--text-color);
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* 툴바 */
        .box-tools-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .char-count {
            font-size: 14px;
            color: var(--sub-text);
        }

        .box-tools {
            display: flex;
            gap: 15px;
        }

        .tool-btn {
            background: none;
            border: none;
            color: var(--sub-text);
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.1s, color 0.2s;
        }

        .tool-btn:hover { color: var(--primary-color); transform: scale(1.15); }

        .mic-btn.recording {
            color: #ff3b30 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* 번역하기 버튼 */
        .translate-btn-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
        }

        .translate-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 199, 60, 0.3);
        }

        .translate-btn:hover { background-color: var(--primary-hover); }

        /* 하단 히스토리 & 단어장 */
        .extra-section-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 0 30px 30px;
        }

        @media (max-width: 900px) {
            .extra-section-container { grid-template-columns: 1fr; }
        }

        .extra-section {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--sub-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-list, .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover { border-color: var(--primary-color); }

        .history-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
        }

        .placeholder { color: var(--sub-text); }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 10000;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- [시작 임팩트] 오프닝 스플래시 레이어 -->
    <div id="splash-overlay">
        <div class="splash-title">
            <i class="fa-solid fa-crown"></i> PAPAKING
        </div>
    </div>

    <!-- 메인 파파킹 애플리케이션 -->
    <div class="app-card">
        <!-- 헤더 -->
        <div class="app-header">
            <div class="header-title">
                <i class="fa-solid fa-crown"></i> 파파킹 (PAPAKING)
            </div>
            <button class="theme-toggle-btn" onclick="toggleDarkMode()" title="다크 모드 전환">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
        </div>

        <!-- 언어 선택 바 -->
        <div class="lang-bar">
            <span class="lang-title" id="source-lang-label">한국어</span>
            <button class="swap-btn" onclick="swapLanguages()" title="언어 방향 전환">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <span class="lang-title" id="target-lang-label">영어</span>
        </div>

        <!-- 메인 번역 공간 (2열 대형 레이아웃) -->
        <div class="main-content">
            <!-- 입력창 -->
            <div class="input-area">
                <textarea id="source-text" placeholder="번역할 내용을 입력하거나 마이크 버튼을 눌러 말씀해 주세요..." oninput="updateCharCount()" onkeydown="handleKeyDown(event)"></textarea>
                <div class="box-tools-wrapper">
                    <span class="char-count" id="char-count">0 / 1000자</span>
                    <div class="box-tools">
                        <button class="tool-btn mic-btn" id="mic-btn" onclick="toggleSpeechRecognition()" title="음성 인식"><i class="fa-solid fa-microphone"></i></button>
                        <button class="tool-btn" onclick="clearInput()" title="지우기"><i class="fa-solid fa-xmark"></i></button>
                        <button class="tool-btn" onclick="speakText('input')" title="발음 듣기"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                </div>
            </div>

            <!-- 번역 결과창 -->
            <div class="result-area">
                <div id="result-text" class="result-text placeholder">번역 결과가 여기에 표시됩니다.</div>
                <div class="box-tools-wrapper" style="justify-content: flex-end;">
                    <div class="box-tools">
                        <button class="tool-btn" id="bookmark-btn" onclick="toggleBookmark()" title="단어장에 저장"><i class="fa-regular fa-star"></i></button>
                        <button class="tool-btn" onclick="copyResult()" title="복사하기"><i class="fa-regular fa-copy"></i></button>
                        <button class="tool-btn" onclick="speakText('result')" title="발음 듣기"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                </div>
            </div>

            <!-- 번역 버튼 -->
            <div class="translate-btn-container">
                <button class="translate-btn" onclick="translateText()">
                    <i class="fa-solid fa-bolt"></i> 파파킹 번역하기
                </button>
            </div>
        </div>

        <!-- 하단 서브 영역 (최근 번역 기록 및 단어장) -->
        <div class="extra-section-container">
            <div class="extra-section">
                <div class="section-title">
                    <span><i class="fa-solid fa-clock-rotate-left"></i> 최근 번역 기록</span>
                    <span style="font-size:12px; cursor:pointer;" onclick="clearHistory()">기록 삭제</span>
                </div>
                <div class="history-list" id="history-list"></div>
            </div>

            <div class="extra-section">
                <div class="section-title">
                    <span><i class="fa-solid fa-book-bookmark"></i> 나만의 단어장</span>
                </div>
                <div class="bookmark-list" id="bookmark-list"></div>
            </div>
        </div>
    </div>

    <!-- 알림 토스트 -->
    <div id="toast" class="toast">메시지</div>

    <script>
        let currentPair = 'ko|en';
        let recognition = null;
        let isRecording = false;

        window.onload = function() {
            renderHistory();
            renderBookmarks();
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
            }
        };

        function updateCharCount() {
            const text = document.getElementById('source-text').value;
            document.getElementById('char-count').innerText = `${text.length} / 1000자`;
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'light');
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;

            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('mic-btn').classList.add('recording');
                showToast('음성을 듣고 있습니다...');
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('source-text').value = transcript;
                updateCharCount();
                translateText();
            };

            recognition.onerror = function() { stopRecordingState(); };
            recognition.onend = function() { stopRecordingState(); };
        }

        function stopRecordingState() {
            isRecording = false;
            document.getElementById('mic-btn').classList.remove('recording');
        }

        function toggleSpeechRecognition() {
            if (!recognition) return showToast('음성 인식을 지원하지 않는 브라우저입니다.');
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.lang = currentPair.startsWith('ko') ? 'ko-KR' : 'en-US';
                recognition.start();
            }
        }

        function swapLanguages() {
            const sourceLabel = document.getElementById('source-lang-label');
            const targetLabel = document.getElementById('target-lang-label');
            const sourceText = document.getElementById('source-text').value;
            const resultText = document.getElementById('result-text').innerText;

            currentPair = (currentPair === 'ko|en') ? 'en|ko' : 'ko|en';
            sourceLabel.innerText = currentPair.startsWith('ko') ? '한국어' : '영어';
            targetLabel.innerText = currentPair.endsWith('en') ? '영어' : '한국어';

            if (resultText && !document.getElementById('result-text').classList.contains('placeholder')) {
                document.getElementById('source-text').value = resultText;
                document.getElementById('result-text').innerText = sourceText;
                updateCharCount();
            }
        }

        async function translateText() {
            const inputText = document.getElementById('source-text').value.trim();
            const resultBox = document.getElementById('result-text');

            if (!inputText) return showToast('텍스트를 입력해주세요.');

            resultBox.classList.remove('placeholder');
            resultBox.innerText = '번역 중...';

            try {
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(inputText)}&langpair=${currentPair}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.responseData && data.responseData.translatedText) {
                    const translated = data.responseData.translatedText;
                    resultBox.innerText = translated;
                    saveToHistory(inputText, translated);
                } else {
                    resultBox.innerText = '번역할 수 없습니다.';
                }
            } catch (error) {
                resultBox.innerText = '오류가 발생했습니다.';
            }
        }

        function saveToHistory(source, result) {
            let history = JSON.parse(localStorage.getItem('translateHistory') || '[]');
            history = history.filter(item => item.source !== source);
            history.unshift({ source, result });
            if (history.length > 5) history.pop();

            localStorage.setItem('translateHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('translateHistory') || '[]');

            if (history.length === 0) {
                list.innerHTML = '<div class="history-item placeholder">최근 번역한 기록이 없습니다.</div>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item" onclick="loadHistory('${escapeHtml(item.source)}', '${escapeHtml(item.result)}')">
                    <span class="history-text">${item.source} ➔ ${item.result}</span>
                    <i class="fa-solid fa-angle-right" style="font-size:12px;"></i>
                </div>
            `).join('');
        }

        function loadHistory(source, result) {
            document.getElementById('source-text').value = source;
            const resultBox = document.getElementById('result-text');
            resultBox.innerText = result;
            resultBox.classList.remove('placeholder');
            updateCharCount();
        }

        function clearHistory() {
            localStorage.removeItem('translateHistory');
            renderHistory();
            showToast('기록이 삭제되었습니다.');
        }

        function toggleBookmark() {
            const source = document.getElementById('source-text').value.trim();
            const result = document.getElementById('result-text').innerText;
            const isPlaceholder = document.getElementById('result-text').classList.contains('placeholder');

            if (!source || isPlaceholder) return showToast('저장할 번역 결과가 없습니다.');

            let bookmarks = JSON.parse(localStorage.getItem('translateBookmarks') || '[]');
            const existsIndex = bookmarks.findIndex(b => b.source === source);

            if (existsIndex > -1) {
                bookmarks.splice(existsIndex, 1);
                showToast('단어장에서 삭제되었습니다.');
            } else {
                bookmarks.unshift({ source, result });
                showToast('단어장에 저장되었습니다! ⭐');
            }

            localStorage.setItem('translateBookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }

        function renderBookmarks() {
            const list = document.getElementById('bookmark-list');
            const bookmarks = JSON.parse(localStorage.getItem('translateBookmarks') || '[]');

            if (bookmarks.length === 0) {
                list.innerHTML = '<div class="history-item placeholder">저장된 단어가 없습니다. 별(⭐)을 눌러 저장해보세요.</div>';
                return;
            }

            list.innerHTML = bookmarks.map(item => `
                <div class="history-item">
                    <span class="history-text" onclick="loadHistory('${escapeHtml(item.source)}', '${escapeHtml(item.result)}')">${item.source} : <b>${item.result}</b></span>
                    <i class="fa-solid fa-trash-can" style="color:#ff3b30;" onclick="removeBookmark('${escapeHtml(item.source)}')"></i>
                </div>
            `).join('');
        }

        function removeBookmark(source) {
            let bookmarks = JSON.parse(localStorage.getItem('translateBookmarks') || '[]');
            bookmarks = bookmarks.filter(b => b.source !== source);
            localStorage.setItem('translateBookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }

        function clearInput() {
            document.getElementById('source-text').value = '';
            const resultBox = document.getElementById('result-text');
            resultBox.innerText = '번역 결과가 여기에 표시됩니다.';
            resultBox.classList.add('placeholder');
            updateCharCount();
        }

        function copyResult() {
            const resultText = document.getElementById('result-text').innerText;
            if (!resultText || document.getElementById('result-text').classList.contains('placeholder')) return;
            navigator.clipboard.writeText(resultText).then(() => showToast('클립보드에 복사되었습니다.'));
        }

        function speakText(type) {
            const text = type === 'input' ? document.getElementById('source-text').value : document.getElementById('result-text').innerText;
            if (!text || document.getElementById('result-text').classList.contains('placeholder')) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = (type === 'input') ? (currentPair.startsWith('ko') ? 'ko-KR' : 'en-US') : (currentPair.endsWith('en') ? 'en-US' : 'ko-KR');
            window.speechSynthesis.speak(utterance);
        }

        function handleKeyDown(e) {
            if (e.ctrlKey && e.key === 'Enter') translateText();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
